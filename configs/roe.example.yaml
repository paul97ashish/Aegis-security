# Example Rules-of-Engagement manifest (design §7.1).
# Sign the CANONICALIZED form with both client and tester keys; the tool
# recomputes the hash and verifies both signatures on startup, failing closed
# on anything missing, invalid, expired, or modified.
#
#   aegis keys generate client && aegis keys generate tester
#   aegis keys sign configs/roe.example.yaml --key .aegis/keys/client.sec
#   aegis keys sign configs/roe.example.yaml --key .aegis/keys/tester.sec
#
# Store the human-signed PDF authorization alongside this file.

engagement:
  id: ACME-2026-0042
  client: "Acme Corp"
  authorized_by:
    name: "Jane Director, CISO"
    contact: jane@acme.example
  tester:
    name: "Paul / Your Firm"
    contact: you@yourfirm.example
  window:
    start: 2026-06-20T09:00:00Z
    end:   2026-06-27T18:00:00Z            # hard stop; tool aborts outside this

scope:
  allow:                                   # explicit allowlist — nothing else is touchable
    hosts:   ["app.acme.example", "10.20.0.0/24"]
    domains: ["*.staging.acme.example"]
    repos:   ["github.com/acme/web-app"]
  deny:                                    # explicit exclusions win over allow
    hosts:   ["10.20.0.5", "billing-prod.acme.example"]
    cidrs:   ["10.20.99.0/24"]

rules:
  permitted_classes: [recon, vuln_scan]    # opt-in per class; add 'exploitation' to enable
  forbidden:
    - denial_of_service
    - social_engineering
    - data_exfiltration
    - lateral_movement
    - persistence
    - destructive_payloads
  max_request_rate: "20/s"                 # protect client availability
  require_human_approval_for: [exploitation]

safety:
  abort_contact: "+1-555-0100"             # client SOC / emergency stop
  kill_switch: true
